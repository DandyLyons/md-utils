name: Validate Schema Publication

on:
  pull_request:
    paths:
      - Sources/md-utils/Resources/*_md-utils.schema.json
      - Sources/md-utils/Resources/2_md-utils-type.schema.json
      - Sources/md-utils/Resources/2_semantic-formats.json
      - site/schemas/**
      - scripts/validate-schema-publication.py
      - scripts/check-schema-immutability.py
      - .github/workflows/schema-publication.yml
  push:
    branches:
      - main
    paths:
      - Sources/md-utils/Resources/*_md-utils.schema.json
      - Sources/md-utils/Resources/2_md-utils-type.schema.json
      - Sources/md-utils/Resources/2_semantic-formats.json
      - site/schemas/**
      - scripts/validate-schema-publication.py
      - scripts/check-schema-immutability.py
      - .github/workflows/schema-publication.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate schema publication files
        run: python3 scripts/validate-schema-publication.py

      - name: Guard immutable published schema versions
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/check-schema-immutability.py --base "origin/${{ github.base_ref }}"
