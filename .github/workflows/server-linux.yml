name: Native Server Linux

on:
  pull_request:
    paths:
      - Package.swift
      - Package.resolved
      - Sources/MarkdownUtilitiesCore/**
      - Sources/MarkdownUtilities/**
      - Sources/MarkdownUtilitiesServer/**
      - Sources/MarkdownUtilitiesTemplates/**
      - Tests/MarkdownUtilitiesTemplatesTests/**
      - Sources/md-utils/TemplateCommands.swift
      - Tests/md-utilsTests/Commands/TemplateTests.swift
      - Sources/MarkdownUtilitiesIndex/**
      - Sources/MarkdownUtilitiesIndexNative/**
      - Sources/MarkdownUtilitiesServerNative/**
      - Tests/MarkdownUtilitiesServerNativeTests/**
      - Sources/md-utils-server/**
      - Tests/MarkdownUtilitiesServerTests/**
      - Dockerfile.server-linux
      - .github/workflows/server-linux.yml
  push:
    branches:
      - main
    paths:
      - Package.swift
      - Package.resolved
      - Sources/MarkdownUtilitiesCore/**
      - Sources/MarkdownUtilities/**
      - Sources/MarkdownUtilitiesServer/**
      - Sources/MarkdownUtilitiesTemplates/**
      - Tests/MarkdownUtilitiesTemplatesTests/**
      - Sources/md-utils/TemplateCommands.swift
      - Tests/md-utilsTests/Commands/TemplateTests.swift
      - Sources/MarkdownUtilitiesIndex/**
      - Sources/MarkdownUtilitiesIndexNative/**
      - Sources/MarkdownUtilitiesServerNative/**
      - Tests/MarkdownUtilitiesServerNativeTests/**
      - Sources/md-utils-server/**
      - Tests/MarkdownUtilitiesServerTests/**
      - Dockerfile.server-linux
      - .github/workflows/server-linux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-server:
    runs-on: ubuntu-latest
    container: swift:6.3.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build native server
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev libjavascriptcoregtk-4.1-dev pkg-config && swift build --product md-utils-server

      - name: Test indexed native server
        run: swift test --filter 'MarkdownUtilitiesServerNativeTests|MarkdownUtilitiesServerTests|MarkdownUtilitiesTemplatesTests|TemplateTests'

      - name: Run native server route smoke test
        run: swift run MarkdownUtilitiesServerLinuxSmoke
